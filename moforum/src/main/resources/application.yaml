spring:
  config:
    import: optional:file:moforum/.env[.properties]
  application:
    name: moforum
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 6MB
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/moforum?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: root
    password: ${DB_PASSWORD:}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key: ${OSS_ACCESS_KEY:}
  secret-key: ${OSS_SECRET_KEY:}
  bucket: ${OSS_BUCKET:}
  max-size: 3145728
